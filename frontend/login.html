<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/login.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Login - PrevSmart</title>
</head>
<body>
    <div class="mainContentCase shadow-lg rounded">
        <form class="p-5 d-flex flex-column justify-content-center">
            <h1 class="fw-bold">Login</h1>
            <h6>PrevSmart</h6>
            <div class="mb-3 mt-4">
                <label for="UserName" class="form-label text-secondary">Usuário</label>
                <input type="text" class="form-control shadow fw-light" id="UserName" placeholder="Nome do Usuário" required>
                <div class="invalid-feedback">Nome do Usúario é Obrigatório</div>
            </div>
            <div class="mb-5">
                <label for="UserPassword" class="form-label text-secondary">Senha</label>
                <input type="password" class="form-control shadow fw-light" id="UserPassword" placeholder="Senha do Usuário" required>
                <div class="invalid-feedback">Senha do Usúario é Obrigatório</div>
            </div>
            <button type="submit" class="btn btn-primary fw-bold">Entrar</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
